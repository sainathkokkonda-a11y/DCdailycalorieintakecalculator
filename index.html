<div class="global-calorie-container">
  <div class="global-calorie-card">
    <div class="global-calorie-header">
      <h2>Daily Calorie Intake Calculator</h2>
      <p>Calculate your daily calorie needs for fitness goals</p>
    </div>
    
    <div class="global-calorie-body">
      <div class="input-group">
        <label>Gender & Age</label>
        <div class="input-flex-wrapper">
          <select id="calorieGender" class="global-select" onchange="calculateCalories()">
            <option value="male" selected>Male</option>
            <option value="female">Female</option>
          </select>
          <input type="number" id="calorieAge" class="global-input" placeholder="Age" value="25">
        </div>
      </div>

      <div class="input-group">
        <label>Height (cm) & Weight (kg)</label>
        <div class="input-flex-wrapper">
          <input type="number" id="calorieHeight" class="global-input" placeholder="Height cm" value="170">
          <input type="number" id="calorieWeight" class="global-input" placeholder="Weight kg" value="68">
        </div>
      </div>

      <div class="input-group">
        <label for="activityLevel">Activity Level</label>
        <select id="activityLevel" class="global-select" onchange="calculateCalories()">
          <option value="1.2">Sedentary (Little or no exercise)</option>
          <option value="1.375" selected>Lightly Active (1-3 days/week)</option>
          <option value="1.55">Moderately Active (3-5 days/week)</option>
          <option value="1.725">Very Active (6-7 days/week)</option>
          <option value="1.9">Extra Active (Physical job/hard training)</option>
        </select>
      </div>

      <button class="btn-calculate" onclick="calculateCalories()">Calculate Calories</button>

      <div class="result-box">
        <div class="result-item highlight-total">
          <span class="result-label">Maintain Weight:</span>
          <span class="result-value" id="maintainCalories">0 Calories/day</span>
        </div>
        <div class="result-item">
          <span class="result-label">Mild Weight Loss (0.25 kg/week):</span>
          <span class="result-value" id="mildLossCalories">0 Cal/day</span>
        </div>
        <div class="result-item">
          <span class="result-label">Weight Loss (0.5 kg/week):</span>
          <span class="result-value" id="weightLossCalories">0 Cal/day</span>
        </div>
        <div class="result-item">
          <span class="result-label">Weight Gain (0.5 kg/week):</span>
          <span class="result-value" id="weightGainCalories">0 Cal/day</span>
        </div>
      </div>
    </div>
  </div>
</div>
